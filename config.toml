# Hugo variables
#
baseurl = "/"
languageCode = "ko-KR"
title = "Do What You Want To Do"
#theme = "hugo-theme-bootstrap4-blog"
theme = "hugo-theme-relearn-main"
# number of posts to show on home/category/tag pages (Default: 10)
[pagination]
pagerSize = 5
# optionally override the site's footer with custom copyright text
# copyright = "Except where otherwise noted, content on this site is licensed under a [Creative Commons Attribution 4.0 International license](https://creativecommons.org/licenses/by-sa/4.0/)."
# Legacy Hugo analytics setting (UA is deprecated, keep only for fallback)
googleAnalytics = "UA-108812986-1"
disqusShortname = "bluedskim"
enableRobotsTXT = true
# Production deploy target. Local `hugo server` overrides via config.development.toml.
publishDir = "../bluedskim.github.io"
hasCJKLanguage = true

[permalinks]
  post = "/:year/:month/:title/"
  page = "/:slug/"

[[menu.shortcuts]]
  name = "Tech"
  url = "/categories/tech/"
  weight = 10

[[menu.shortcuts]]
  name = "Samba"
  url = "/tags/samba/"
  weight = 20

[[menu.shortcuts]]
  name = "음악"
  url = "/categories/음악/"
  weight = 30

[[menu.shortcuts]]
  name = "일상사"
  url = "/categories/일상사/"
  weight = 40

[[menu.shortcuts]]
  name = "- Github"
  url = "https://github.com/bluedskim"
  weight = 50

[[menu.shortcuts]]
  name = "- Bohemia"
  url = "http://bohemia.band"
  weight = 60

[[menu.shortcuts]]
  name = "- Instagram"
  url = "https://www.instagram.com/bluedskim/"
  weight = 70

[[menu.shortcuts]]
  name = "- Youtube Channel"
  url = "https://www.youtube.com/user/bluedskim/videos"
  weight = 80

[[menu.shortcuts]]
  name = "- Sound Cloud"
  url = "https://soundcloud.com/bluedskim"
  weight = 90

# Theme variables
#
[params]
  # Preferred GA4 Measurement ID (set this to enable modern Google Analytics)
  googleAnalyticsID = "G-3QTEZE6PDE"

  linkTitle = "Do What You Want To Do"
  dateFormat = "2006-01-02"
  disableLandingPageButton = false
  disableShortcutsTitle = false
  showVisitedLinks = true
  collapsibleMenu = true
  sidebarmenus = [
    { type = "page", identifier = "main" },
    { type = "menu", identifier = "shortcuts", disableTitle = false }
  ]
  themeVariant = [
    { identifier = "relearn-auto", name = "Auto", auto = ["relearn-light", "relearn-dark"] },
    { identifier = "learn", name = "Learn" }
  ]
  custom_css = ["custom.css"]

[author]
name = "Dennis"

# Default content language for Hugo 0.17's multilingual support (default is "en")
# See: https://github.com/spf13/hugo/blob/master/docs/content/content/multilingual.md
DefaultContentLanguage = "kr"

# Languages to render
#[languages.en]
#[languages.bg]

# vim: ts=2 sw=2 et

# syntax highlight
pygmentsCodeFences = true
#pygmentsStyle = api

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
home = [ "html", "rss", "print" ]
section = [ "html", "rss", "print" ]
page = [ "html", "print" ]
[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
